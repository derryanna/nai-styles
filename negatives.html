<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Негативы для Новелки</title>
<style>
  :root { --bg: #17141c; --card: #221d2a; --line: #352d42; --text: #ece7f3; --dim: #a79db8; --accent: #b48cff; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 18px 16px 6px; max-width: 900px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  .sub { color: var(--dim); margin: 0 0 12px; }
  a { color: var(--accent); }
  a.chip { display: inline-block; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card);
    color: var(--text); text-decoration: none; }
  main { max-width: 900px; margin: 0 auto; padding: 12px 16px 40px; display: grid; gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px 14px;
    display: flex; flex-direction: column; gap: 10px; scroll-margin-top: 12px; }
  .card.hit { border-color: var(--accent); }
  .name { font-weight: 600; font-size: 16px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; color: var(--dim); font-size: 13px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); }
  .badge.house { border-color: var(--accent); color: var(--accent); }
  a.style { font-size: 13px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); text-decoration: none; }
  .text { margin: 0; color: var(--dim); font-size: 13px; word-break: break-word; }
  button.act { align-self: flex-start; padding: 9px 18px; border-radius: 10px; border: 1px solid var(--line); background: #2b2436;
    color: var(--text); font: inherit; cursor: pointer; }
  button.act:active, button.act.done { border-color: var(--accent); }
  @media (max-width: 520px) { button.act { align-self: stretch; } }
</style>
</head>
<body>
<header>
  <h1>Негативы для Новелки</h1>
  <p class="sub">Готовые негативы: что вписать в поле «Undesired Content», чтобы картинка была чище. У негатива подписано, с каким стилем он идёт в паре.</p>
  <a class="chip" href="./">← Стили</a>
</header>
<main id="list"></main>
<script src="styles.js"></script>
<script src="negatives.js"></script>
<script>
(function () {
  var NEG = (window.NEG || { list: [] }).list, STYLES = (window.LIB || { styles: [] }).styles;
  var list = document.getElementById('list'), byId = {};
  STYLES.forEach(function (s) { byId[s.id] = s; });

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }

  function fallback(text) {
    var t = el('textarea');
    t.value = text;
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy'); } catch (e) {}
    t.remove();
  }

  function copy(btn, text) {
    function ok() {
      var old = btn.textContent;
      btn.textContent = 'Скопировано';
      btn.classList.add('done');
      setTimeout(function () { btn.textContent = old; btn.classList.remove('done'); }, 1200);
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(ok, function () { fallback(text); ok(); });
    } else { fallback(text); ok(); }
  }

  NEG.forEach(function (n) {
    var c = el('div', 'card');
    c.id = n.id;
    c.appendChild(el('div', 'name', n.name));
    var row = el('div', 'row');
    if (n.house) row.appendChild(el('span', 'badge house', 'бот ставит его сам ко всем стилям'));
    var mates = (n.styles || []).map(function (id) { return byId[id]; }).filter(Boolean);  // убранный стиль просто не показываем
    if (mates.length) row.appendChild(el('span', null, 'В паре со стилем:'));
    mates.forEach(function (s) {
      var a = el('a', 'style', s.name);
      a.href = './#' + s.id;
      row.appendChild(a);
    });
    if (row.childNodes.length) c.appendChild(row);
    var b = el('button', 'act', 'Скопировать негатив');
    b.onclick = function () { copy(b, n.text); };
    c.appendChild(b);
    c.appendChild(el('p', 'text', n.text));
    list.appendChild(c);
  });

  function mark() {
    var id = location.hash.slice(1);
    Array.prototype.forEach.call(list.children, function (c) { c.classList.toggle('hit', c.id === id); });
    var hit = id && document.getElementById(id);
    if (hit) hit.scrollIntoView();
  }
  window.onhashchange = mark;
  mark();
})();
</script>
</body>
</html>
